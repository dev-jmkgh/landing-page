# =============================================================================
# jmkglobalholdings.com — the website
#
# Serves the Next.js static export from frontend/out.
#
# NOTE ON ROUTING: this is not a single-page app, so do NOT use the usual
# `try_files $uri $uri/ /index.html;` SPA fallback. `next.config.mjs` sets
# `trailingSlash: true`, so every route is exported as its own directory with an
# index.html (`/about/` -> `about/index.html`). An SPA fallback would answer every
# unknown URL with the home page at status 200 — which hides broken links, and tells
# search engines that every mistyped URL is a valid duplicate of the home page.
# The rules below resolve real files and fall through to a genuine 404.
#
# Install:
#   sudo cp jmkglobalholdings.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/jmkglobalholdings.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then add TLS with:
#   sudo certbot --nginx -d jmkglobalholdings.com -d www.jmkglobalholdings.com
# Certbot rewrites this file to add the 443 block and the HTTP->HTTPS redirect.
#
# ONCE CERTBOT HAS RUN, DO NOT COPY THIS FILE OVER THE INSTALLED ONE. The version
# in /etc/nginx/sites-available/ contains Certbot's TLS block; this one does not.
# Overwriting it drops the site back to plain HTTP. Apply later changes by editing
# the installed file, or re-run Certbot afterwards. deploy.sh does not copy it.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name jmkglobalholdings.com www.jmkglobalholdings.com;

    root /var/www/jmkglobalholdings/frontend/out;
    index index.html;

    # Certbot writes its challenge here; it must stay reachable over plain HTTP
    # even after the redirect below is added, or renewal fails.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Hashed build assets never change under the same name.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # HTML is revalidated so a deploy is picked up immediately.
    #
    # The security headers are repeated here deliberately. Nginx does not merge
    # add_header across levels: a location containing any add_header inherits none
    # from the server block. A request for `/` resolves through the `index`
    # directive to /index.html, which re-enters this location — so without these
    # three lines the home page, and only the home page, would ship with no
    # nosniff, no referrer policy and no HSTS while every other route had them.
    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15768000" always;
    }

    location / {
        # `$uri/` resolves the exported per-route directories; `$uri.html` covers any
        # route exported without a trailing slash. No SPA fallback — see the note above.
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # The app is served from a different origin than the API, so nothing here needs
    # CORS headers; the API sets its own.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Six months, no includeSubDomains and no preload. A browser that has seen this
    # header refuses plain HTTP to this host until it expires, and preload would put
    # the domain on a list that takes months to leave — so this stays deliberately
    # reversible. Raise to 31536000 once the certificate has renewed unattended at
    # least once. Ignored over plain HTTP by specification, so it is harmless in the
    # port 80 block before Certbot has run.
    add_header Strict-Transport-Security "max-age=15768000" always;
}
