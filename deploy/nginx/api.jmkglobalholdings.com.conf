# =============================================================================
# api.jmkglobalholdings.com — reverse proxy to the Node API
#
# The API listens on 127.0.0.1:5000 and is never exposed directly; port 5000 stays
# closed in the security group and Nginx is the only way in.
#
# Install:
#   sudo cp api.jmkglobalholdings.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/api.jmkglobalholdings.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then:
#   sudo certbot --nginx -d api.jmkglobalholdings.com
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name api.jmkglobalholdings.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Resume uploads. MAX_UPLOAD_MB defaults to 5, and multipart framing adds a little
    # on top; Nginx's own default is 1m, which would reject a valid CV with a 413
    # before the request ever reached the application — where the friendly error and
    # the file-type checks live. Keep this comfortably above MAX_UPLOAD_MB.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # The API's rate limiting keys on the client IP, which it reads from
        # X-Forwarded-For — that only works when TRUST_PROXY=1 is set in the backend
        # .env. Without it every request appears to come from 127.0.0.1 and one
        # visitor can exhaust the limit for everybody.

        # Gmail hand-off can take a few seconds on a slow SMTP round trip, and the
        # submission endpoints wait on it to report delivery honestly.
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        proxy_buffering off;
    }

    # Cheap liveness probe, no proxying overhead in the log.
    location = /api/health {
        proxy_pass http://127.0.0.1:5000/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    add_header X-Content-Type-Options "nosniff" always;
}
