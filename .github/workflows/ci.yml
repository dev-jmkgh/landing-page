name: CI

# The deploy workflow only touches the frontend, so without this the backend would
# never be compiled or type-checked by CI at all.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — lint, types, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build static export
        working-directory: frontend
        env:
          NEXT_PUBLIC_SITE_URL: https://www.jmkglobalholdings.com
          NEXT_PUBLIC_API_BASE_URL: https://api.jmkglobalholdings.com/api
        run: npm run build

      - name: Check the export is complete
        working-directory: frontend
        run: |
          test -f out/index.html
          test -f out/.htaccess
          test -f out/sitemap.xml
          test -f out/robots.txt
          test -f out/images/og/og-default.png
          echo "Exported $(find out -name '*.html' | wc -l) HTML pages"

  backend:
    name: Backend — types, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      - name: Type-check
        working-directory: backend
        run: npm run typecheck

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Check the build output
        working-directory: backend
        run: test -f dist/server.js

      - name: Audit production dependencies
        working-directory: backend
        # Advisory only — a new advisory should not block a deploy at 3am.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
