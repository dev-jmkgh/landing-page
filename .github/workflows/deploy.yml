name: Build and deploy website

# Builds the static site and publishes it to Hostinger's public_html over FTPS.
# The API is deployed separately — see the commented job at the bottom.
#
# Required repository secrets (Settings ▸ Secrets and variables ▸ Actions):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, SITE_URL, API_BASE_URL

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-website
  # Never cancel mid-upload: the FTP step writes into the live public_html in place,
  # so an aborted transfer would leave the site half-updated. A queued run waits instead.
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build static site and upload
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npm run typecheck

      - name: Build static export
        working-directory: frontend
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.SITE_URL }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.API_BASE_URL }}
          NEXT_PUBLIC_YOUTUBE_URL: ${{ vars.YOUTUBE_URL }}
          NEXT_PUBLIC_GOOGLE_MAPS_EMBED_URL: ${{ vars.GOOGLE_MAPS_EMBED_URL }}
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ vars.RECAPTCHA_SITE_KEY }}
        run: npm run build

      - name: Verify the export looks complete
        working-directory: frontend
        run: |
          test -f out/index.html
          test -f out/.htaccess
          test -f out/sitemap.xml
          test -f out/robots.txt
          echo "Export contains $(find out -name '*.html' | wc -l) HTML pages"

      - name: Publish to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./frontend/out/
          server-dir: ./public_html/
          # Never let a deploy remove files the site needs but the build does not own.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .well-known/**

